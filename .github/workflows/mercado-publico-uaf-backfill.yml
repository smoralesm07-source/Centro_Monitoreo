name: Mercado Publico UAF selective backfill

on:
  workflow_dispatch:
  push:
    paths:
      - 'mercado-publico-uaf-backfill-trigger.txt'

permissions:
  contents: write

jobs:
  scan-uaf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan ChileCompra bulk files for UAF
        run: python3 tools/mp_uaf_backfill_scan.py

      - name: Commit refreshed UAF discovery file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mercado-publico-pilot/data/uaf-licitaciones-2023-current.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh UAF Mercado Publico discovery dataset"
          git push
