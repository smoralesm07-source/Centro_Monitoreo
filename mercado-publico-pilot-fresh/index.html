<style>
:root{color-scheme:dark;--bg:#06090f;--canvas:#0a0f18;--panel:#10161f;--panel2:#151d28;--raised:#1b2533;--input:#0d131c;--line:#1e2937;--line2:#2b3a4d;--ink:#e8eef6;--ink2:#9fb0c4;--ink3:#6b7f96;--accent:#2dd4a7;--accent2:#1a8a6d;--blue:#7dd3fc;--warn:#ffc94d;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px var(--font)}button,input,select{font:inherit}.shell{max-width:1440px;margin:auto;padding:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#10231f;border:1px solid #28584e;color:var(--accent);font-weight:800}.brand h1{margin:0;font-size:16px}.brand p{margin:3px 0 0;color:var(--ink3);font-size:11px}.login{max-width:440px;margin:8vh auto;padding:24px}.login h2{margin:22px 0 6px;font-size:19px}.muted{color:var(--ink2)}.tiny{font-size:11px;color:var(--ink3)}.field{display:grid;gap:7px;margin:13px 0}label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}input,select{width:100%;background:var(--input);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:10px 11px;outline:none}input:focus,select:focus{border-color:var(--accent2)}button{border:1px solid var(--line2);background:var(--raised);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:var(--accent2);border-color:var(--accent2);font-weight:700}.ghost{background:transparent;color:var(--ink2)}button:disabled{opacity:.45;cursor:not-allowed}.note{padding:10px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;color:var(--ink2);font-size:11px;line-height:1.45}.warn{border-color:#594a20;color:#f6da8d}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.pills{display:flex;gap:7px;align-items:center}.pill{border:1px solid var(--line2);border-radius:999px;padding:5px 8px;font-size:9px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}.pill.ok{border-color:#28584e;color:var(--accent);background:rgba(45,212,167,.08)}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.side{padding:15px;align-self:start;position:sticky;top:14px}.main{overflow:hidden}.hero{padding:18px 20px;border-bottom:1px solid var(--line)}.code-search{display:grid;grid-template-columns:1fr auto;gap:8px}.sourcebar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.results-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.table-wrap{max-height:68vh;overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th{position:sticky;top:0;background:#0f1620;color:var(--ink3);font-size:9px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2)}td{padding:10px;border-bottom:1px solid #172130;vertical-align:top}tr[data-code]{cursor:pointer}tr[data-code]:hover td{background:var(--panel2)}.code{font:10px var(--mono);color:var(--accent)}.state{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px 7px;font-size:9px;color:var(--ink2)}.empty{padding:42px;text-align:center;color:var(--ink3)}.drawer{position:fixed;inset:0;background:rgba(2,5,9,.72);display:flex;justify-content:flex-end;z-index:50}.drawer.hidden{display:none}.panel{width:min(1060px,96vw);height:100%;background:var(--canvas);overflow:auto;border-left:1px solid var(--line2)}.detail-top{padding:20px;position:sticky;top:0;background:rgba(10,15,24,.97);border-bottom:1px solid var(--line);z-index:2}.detail-top h2{font-size:19px;margin:5px 0 8px}.detail-meta{display:flex;gap:7px;flex-wrap:wrap}.tabs{display:flex;gap:5px;padding:10px 18px;position:sticky;top:116px;background:var(--canvas);border-bottom:1px solid var(--line);z-index:2;overflow:auto}.tab{white-space:nowrap;background:transparent;color:var(--ink2)}.tab.active{background:var(--raised);color:var(--ink)}.section{padding:18px 20px;border-bottom:1px solid var(--line)}.section h3{font-size:12px;margin:0 0 12px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.fact{padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:62px}.fact .k{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}.fact .v{margin-top:6px;line-height:1.35;word-break:break-word}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px}.time{border-left:2px solid var(--accent2);background:var(--panel);padding:9px 10px}.items{font-size:10px}.items .desc{min-width:260px;max-width:480px}.winner{color:var(--accent)}.raw{background:#05080d;border:1px solid var(--line);padding:14px;border-radius:8px;white-space:pre-wrap;word-break:break-word;font:10px/1.5 var(--mono);max-height:65vh;overflow:auto}.fieldlist td:first-child{font-family:var(--mono);color:var(--blue);width:34%}.hidden{display:none!important}.fatal{max-width:720px;margin:30px auto;padding:18px;border:1px solid #6b3030;background:#261416;border-radius:12px;color:#ffc1c1}@media(max-width:850px){.shell{padding:10px}.workspace{grid-template-columns:1fr}.side{position:static}.code-search{grid-template-columns:1fr}.panel{width:100vw}}
</style></head><body>
