<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mercado Público · Piloto independiente</title>
<style>
:root{color-scheme:dark;--bg-abyss:#06090f;--bg-canvas:#0a0f18;--bg-panel:#10161f;--bg-panel-2:#151d28;--bg-raised:#1b2533;--bg-input:#0d131c;--line:#1e2937;--line-soft:#172130;--line-strong:#2b3a4d;--ink:#e8eef6;--ink-2:#9fb0c4;--ink-3:#6b7f96;--accent:#2dd4a7;--accent-dim:#1a8a6d;--accent-glow:rgba(45,212,167,.16);--blue:#7dd3fc;--warn:#ffc94d;--radius:10px;--radius-lg:16px;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.28);--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg-abyss);color:var(--ink);font-family:var(--font);font-size:13px}.shell{max-width:1440px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,#16342e,#0e1a1d);border:1px solid #28584e;display:grid;place-items:center;color:var(--accent);font-weight:800}.brand h1{font-size:16px;margin:0}.brand p{margin:3px 0 0;color:var(--ink-3);font-size:11px}.pill{border:1px solid var(--line-strong);border-radius:999px;padding:6px 9px;color:var(--ink-2);font-size:10px;letter-spacing:.05em;text-transform:uppercase}.pill.ok{color:var(--accent);border-color:#28584e;background:var(--accent-glow)}.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}.login{max-width:430px;margin:9vh auto;padding:24px}.login h2{font-size:19px;margin:18px 0 6px}.muted{color:var(--ink-2)}.tiny{font-size:11px;color:var(--ink-3)}label{font-size:10px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}input,select,button{font:inherit}input,select{width:100%;background:var(--bg-input);border:1px solid var(--line-strong);border-radius:8px;color:var(--ink);padding:10px 11px;outline:none}input:focus,select:focus{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-glow)}button{border:1px solid var(--line-strong);background:var(--bg-raised);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#fff;font-weight:700}button.ghost{background:transparent;color:var(--ink-2)}button:disabled{opacity:.45;cursor:not-allowed}.field{display:grid;gap:7px;margin:13px 0}.note{padding:10px 12px;border:1px solid var(--line);background:var(--bg-panel-2);border-radius:8px;color:var(--ink-2);font-size:11px;line-height:1.45}.note.warn{border-color:#594a20;color:#f6da8d}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.side{padding:15px;align-self:start;position:sticky;top:14px}.side h3{margin:0 0 4px;font-size:12px}.side .field{margin:12px 0}.main{overflow:hidden}.hero{padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(45,212,167,.04),transparent)}.hero .code-search{display:grid;grid-template-columns:1fr auto;gap:8px}.sourcebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.results-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.table-wrap{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%;font-size:11px}th{position:sticky;top:0;background:#0f1620;color:var(--ink-3);font-size:9px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-strong)}td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top}tr[data-code]{cursor:pointer}tr[data-code]:hover td{background:var(--bg-panel-2)}.code{font-family:var(--mono);font-size:10px;color:var(--accent)}.state{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px 7px;font-size:9px;color:var(--ink-2)}.drawer{position:fixed;inset:0;background:rgba(2,5,9,.68);display:flex;justify-content:flex-end;z-index:30}.drawer.hidden{display:none}.panel{width:min(1040px,94vw);height:100%;background:var(--bg-canvas);border-left:1px solid var(--line-strong);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.45)}.detail-top{padding:20px;position:sticky;top:0;background:rgba(10,15,24,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:2}.detail-top h2{font-size:19px;margin:5px 0 8px}.detail-meta{display:flex;flex-wrap:wrap;gap:7px}.tabs{display:flex;gap:5px;padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:115px;background:var(--bg-canvas);z-index:2;overflow:auto}.tab{white-space:nowrap;padding:7px 9px;background:transparent;color:var(--ink-2)}.tab.active{background:var(--bg-raised);color:var(--ink)}.section{padding:18px 20px;border-bottom:1px solid var(--line)}.section h3{font-size:12px;margin:0 0 12px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.fact{padding:10px;background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;min-height:62px}.fact .k{font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}.fact .v{margin-top:6px;font-size:12px;word-break:break-word;line-height:1.35}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px}.time{border-left:2px solid var(--accent-dim);background:var(--bg-panel);padding:9px 10px}.items{width:100%;font-size:10px}.items td{padding:8px}.items .desc{min-width:260px;max-width:480px}.winner{color:var(--accent)}.raw{background:#05080d;border:1px solid var(--line);padding:14px;border-radius:8px;white-space:pre-wrap;word-break:break-word;font:10px/1.5 var(--mono);max-height:65vh;overflow:auto}.fieldlist td:first-child{font-family:var(--mono);color:var(--blue);width:34%}.empty{padding:44px;text-align:center;color:var(--ink-3)}.spinner{width:16px;height:16px;border:2px solid #334255;border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:var(--blue)}@media(max-width:850px){.shell{padding:10px}.workspace{grid-template-columns:1fr}.side{position:static}.hero .code-search{grid-template-columns:1fr}.panel{width:100vw}.tabs{top:135px}}
</style>
</head>
<body><div id="app"></div>
<script>
const SB='https://ldmtlwzqaqmegedktlxr.supabase.co';
const KEY='sb_publishable_Nu21dZFBM3NwtIvOwIM8ag_9tyfDJyR';
const FN=SB+'/functions/v1/mercado-publico-explorer-pilot';
let session=null,rows=[],detail=null,rawDetail=null,activeTab='resumen';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
function money(v,c='CLP'){if(v===null||v===undefined||v==='')return '—';const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('es-CL',{style:'currency',currency:c||'CLP',maximumFractionDigits:0}).format(n):String(v)}
function dt(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('es-CL',{dateStyle:'medium',timeStyle:'short'}).format(d)}
function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
async function authPost(path,body){const r=await fetch(SB+path,{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.error_description||d.message||'Error de autenticación');return d}
function save(s){session=s;if(s)localStorage.setItem('mp_pilot_session',JSON.stringify(s));else localStorage.removeItem('mp_pilot_session')}
async function refresh(){if(!session?.refresh_token)return false;try{save(await authPost('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token}));return true}catch{return false}}
async function api(action,payload={}){if(!session?.access_token)throw new Error('Sesión requerida');let r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});if(r.status===401&&await refresh())r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.detail||'Error de consulta');return d}
function login(msg=''){app.innerHTML='<div class="shell"><div class="card login"><div class="brand"><div class="mark">MP</div><div><h1>Mercado Público</h1><p>Piloto independiente · estándar visual ATLAS</p></div></div><h2>Acceso al piloto</h2><p class="muted">Explorador informativo de la API oficial. Está aislado de Atlas y no incorpora scoring ni detección de anomalías.</p>'+(msg?'<div class="note warn">'+esc(msg)+'</div>':'')+'<div id="authstep"><div class="field"><label>Correo electrónico</label><input id="email" type="email" placeholder="nombre@organizacion.cl" autocomplete="email"></div><button id="send" class="primary" style="width:100%">Enviar código de acceso</button></div></div></div>';document.getElementById('send').onclick=sendOtp}
async function sendOtp(){const e=document.getElementById('email').value.trim().toLowerCase();if(!e.includes('@'))return login('Ingresa un correo válido.');try{document.getElementById('send').disabled=true;await authPost('/auth/v1/otp',{email:e,create_user:true});document.getElementById('authstep').innerHTML='<div class="note">Código enviado a <strong>'+esc(e)+'</strong>.</div><div class="field"><label>Código de verificación</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="Código recibido"></div><button id="verify" class="primary" style="width:100%">Verificar e ingresar</button><button id="change" class="ghost" style="width:100%;margin-top:8px">Cambiar correo</button>';document.getElementById('verify').onclick=()=>verify(e);document.getElementById('change').onclick=()=>login()}catch(err){login(err.message)}}
async function verify(email){try{const token=document.getElementById('otp').value.replace(/\D/g,'');const d=await authPost('/auth/v1/verify',{type:'email',email,token});save(d);await boot()}catch(err){login(err.message)}}
async function boot(){try{await api('session');workspace();await loadDate(today())}catch(err){save(null);login(err.message)}}
function workspace(){app.innerHTML='<div class="shell"><div class="top"><div class="brand"><div class="mark">MP</div><div><h1>Mercado Público · Explorador</h1><p>Piloto independiente · fuente oficial en vivo</p></div></div><div style="display:flex;gap:7px"><span class="pill ok">sin scoring</span><span class="pill">aislado de atlas</span><button id="logout" class="ghost">Salir</button></div></div><div class="workspace"><aside class="card side"><h3>Explorar licitaciones</h3><div class="tiny">Consulta por día y filtra localmente para reducir llamadas a la API.</div><div class="field"><label>Fecha</label><input id="date" type="date" value="'+today()+'"></div><button id="dateBtn" class="primary" style="width:100%">Cargar fecha</button><div class="field"><label>Filtrar resultados</label><input id="filter" placeholder="Nombre, código u organismo"></div><div class="field"><label>Estado</label><select id="state"><option value="">Todos</option></select></div><div class="note" style="margin-top:14px">El detalle se consulta de a <strong>una licitación por vez</strong>. La prueba controlada detectó que Mercado Público rechaza solicitudes de detalle simultáneas.</div></aside><main class="card main"><div class="hero"><label>Abrir licitación por código</label><div class="code-search"><input id="codeSearch" placeholder="Ej. 1071775-10-LE26"><button id="codeBtn" class="primary">Abrir código</button></div><div id="sourcebar" class="sourcebar"><span class="pill">API Mercado Público v1</span></div></div><div class="results-head"><div><strong id="count">0</strong> <span class="muted">licitaciones</span></div><span id="status" class="tiny">Listo</span></div><div id="table" class="table-wrap"><div class="empty">Seleccione una fecha.</div></div></main></div></div><div id="drawer" class="drawer hidden"><div class="panel"><div id="detail"></div></div></div>';document.getElementById('logout').onclick=()=>{save(null);login()};document.getElementById('dateBtn').onclick=()=>loadDate(document.getElementById('date').value);document.getElementById('filter').oninput=renderRows;document.getElementById('state').onchange=renderRows;document.getElementById('codeBtn').onclick=()=>openCode(document.getElementById('codeSearch').value);document.getElementById('codeSearch').onkeydown=e=>{if(e.key==='Enter')openCode(e.target.value)};document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDetail()}}
async function loadDate(date){setStatus('Consultando API…',true);try{const d=await api('date',{date});rows=d.rows||[];document.getElementById('date').value=date;const states=[...new Set(rows.map(x=>x.state).filter(Boolean))].sort();document.getElementById('state').innerHTML='<option value="">Todos</option>'+states.map(x=>'<option>'+esc(x)+'</option>').join('');document.getElementById('sourcebar').innerHTML='<span class="pill ok">API '+esc(d.meta.version||'v1')+'</span><span class="pill">'+esc(date)+'</span><span class="pill">'+esc(d.meta.latency_ms)+' ms</span><span class="pill">respuesta '+esc(dt(d.meta.response_created_at))+'</span>';renderRows();setStatus('Fuente actualizada',false)}catch(err){setStatus(err.message,false);document.getElementById('table').innerHTML='<div class="empty">'+esc(err.message)+'</div>'}}
function filtered(){const q=(document.getElementById('filter')?.value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),st=document.getElementById('state')?.value||'';return rows.filter(x=>(!st||String(x.state)===st)&&(!q||[x.code,x.name,x.buyer].join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q)))}
function renderRows(){const r=filtered();document.getElementById('count').textContent=String(r.length);document.getElementById('table').innerHTML=r.length?'<table><thead><tr><th>Código</th><th>Licitación</th><th>Organismo</th><th>Estado</th><th>Cierre</th></tr></thead><tbody>'+r.map(x=>'<tr data-code="'+esc(x.code)+'"><td class="code">'+esc(x.code)+'</td><td><strong>'+esc(x.name||'—')+'</strong><div class="tiny">'+esc(x.type||'')+'</div></td><td>'+esc(x.buyer||'—')+'</td><td><span class="state">'+esc(x.state||'—')+'</span></td><td>'+esc(dt(x.close))+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No hay resultados para el filtro.</div>';document.querySelectorAll('tr[data-code]').forEach(x=>x.onclick=()=>openCode(x.dataset.code))}
function setStatus(t,b){const x=document.getElementById('status');if(x)x.innerHTML=(b?'<span class="spinner"></span> ':'')+esc(t)}
async function openCode(code){code=String(code||'').trim().toUpperCase();if(!code)return;setStatus('Cargando detalle '+code+'…',true);try{const d=await api('detail',{code});detail=d.item;rawDetail=d.raw;activeTab='resumen';renderDetail(d.meta);document.getElementById('drawer').classList.remove('hidden');setStatus('Detalle actualizado desde fuente',false)}catch(err){setStatus(err.message,false);alert(err.message)}}
function closeDetail(){document.getElementById('drawer').classList.add('hidden');detail=null;rawDetail=null}
function fact(k,v){return '<div class="fact"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v??'—')+'</div></div>'}
function scalarFacts(keys){return '<div class="facts">'+keys.map(([k,label,fmt])=>fact(label,fmt?fmt(detail?.[k]):detail?.[k])).join('')+'</div>'}
function renderDetail(m){const d=detail||{},c=d.Comprador||{},a=d.Adjudicacion||{},items=arr(d?.Items?.Listado||d?.Items);document.getElementById('detail').innerHTML='<div class="detail-top"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="code">'+esc(d.CodigoExterno||'')+'</div><h2>'+esc(d.Nombre||'Licitación')+'</h2><div class="detail-meta"><span class="state">'+esc(d.Estado||'—')+'</span><span class="pill">'+esc(d.Tipo||'')+'</span><span class="pill">'+esc(c.NombreOrganismo||'')+'</span><span class="pill ok">en vivo · '+esc(m.latency_ms)+' ms</span></div></div><button id="close" class="ghost">Cerrar</button></div></div><div class="tabs">'+[['resumen','Resumen'],['comprador','Comprador'],['cronograma','Cronograma'],['condiciones','Condiciones'],['items','Ítems y adjudicación'],['campos','Todos los campos'],['json','JSON original']].map(x=>'<button class="tab '+(activeTab===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div id="tabbody"></div>';document.getElementById('close').onclick=closeDetail;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{activeTab=x.dataset.tab;renderDetail(m)});renderTab(m,items,c,a)}
function renderTab(m,items,c,a){const body=document.getElementById('tabbody');if(activeTab==='resumen')body.innerHTML='<div class="section"><h3>Identificación del proceso</h3>'+scalarFacts([['CodigoExterno','Código'],['Estado','Estado'],['Tipo','Tipo'],['TipoConvocatoria','Convocatoria'],['Moneda','Moneda'],['MontoEstimado','Monto estimado',v=>money(v,detail.Moneda)],['CantidadReclamos','Reclamos'],['DiasCierreLicitacion','Días de cierre']])+'</div><div class="section"><h3>Descripción</h3><div class="fact"><div class="v">'+esc(detail.Descripcion||'—')+'</div></div></div><div class="section"><h3>Adjudicación</h3><div class="facts">'+fact('Número',a.Numero)+fact('Fecha',dt(a.Fecha))+fact('N.º oferentes',a.NumeroOferentes)+fact('Tipo',a.Tipo)+'</div>'+(a.UrlActa?'<p><a href="'+esc(a.UrlActa)+'" target="_blank" rel="noopener">Abrir acta de adjudicación en Mercado Público ↗</a></p>':'')+'</div><div class="section"><h3>Fuente</h3><div class="facts">'+fact('API','Mercado Público v1')+fact('Consulta',dt(m.fetched_at))+fact('Respuesta API',dt(m.response_created_at))+fact('Rutas JSON presentes',m.field_paths)+'</div></div>';
else if(activeTab==='comprador')body.innerHTML='<div class="section"><h3>Organismo y unidad compradora</h3><div class="facts">'+Object.entries(c).map(([k,v])=>fact(k,v)).join('')+'</div></div><div class="section"><h3>Responsables del proceso</h3>'+scalarFacts([['NombreResponsablePago','Responsable de pago'],['EmailResponsablePago','Correo pago'],['NombreResponsableContrato','Responsable contrato'],['EmailResponsableContrato','Correo contrato'],['FonoResponsableContrato','Teléfono contrato']])+'</div>';
else if(activeTab==='cronograma'){const f=detail.Fechas||{};body.innerHTML='<div class="section"><h3>Hitos informados por la API</h3><div class="timeline">'+Object.entries(f).map(([k,v])=>'<div class="time"><div class="tiny">'+esc(k.replace(/Fecha/g,'').replace(/([A-Z])/g,' $1').trim())+'</div><strong>'+esc(dt(v))+'</strong></div>').join('')+'</div></div>'}
else if(activeTab==='condiciones')body.innerHTML='<div class="section"><h3>Condiciones económicas y contractuales</h3>'+scalarFacts([['Estimacion','Estimación'],['FuenteFinanciamiento','Fuente financiamiento'],['VisibilidadMonto','Visibilidad monto'],['Modalidad','Modalidad'],['TipoPago','Tipo pago'],['TomaRazon','Toma de razón'],['Contrato','Contrato'],['Obras','Obras'],['SubContratacion','Subcontratación'],['ProhibicionContratacion','Prohibición contratación'],['TipoDuracionContrato','Tipo duración'],['TiempoDuracionContrato','Duración'],['UnidadTiempoDuracionContrato','Unidad duración'],['EsBaseTipo','Base tipo'],['EsRenovable','Renovable'],['ValorTiempoRenovacion','Tiempo renovación'],['PeriodoTiempoRenovacion','Unidad renovación'],['ExtensionPlazo','Extensión plazo'],['CodigoBIP','Código BIP']])+'</div><div class="section"><h3>Direcciones y observaciones</h3>'+scalarFacts([['DireccionVisita','Dirección visita'],['DireccionEntrega','Dirección entrega'],['JustificacionMontoEstimado','Justificación monto'],['JustificacionPublicidad','Justificación publicidad'],['ObservacionContract','Observación contrato']])+'</div>';
else if(activeTab==='items')body.innerHTML='<div class="section"><h3>'+items.length+' línea(s) de producto o servicio</h3><div style="overflow:auto"><table class="items"><thead><tr><th>#</th><th>Producto</th><th>Descripción</th><th>Cantidad</th><th>Unidad</th><th>Proveedor adjudicado</th><th>RUT</th><th>Monto unitario</th></tr></thead><tbody>'+items.map(i=>{const ad=i.Adjudicacion||{};return '<tr><td>'+esc(i.Correlativo)+'</td><td><strong>'+esc(i.NombreProducto||'—')+'</strong><div class="tiny">UNSPSC '+esc(i.CodigoProducto||'')+' · '+esc(i.CodigoCategoria||'')+'</div></td><td class="desc">'+esc(i.Descripcion||'—')+'<div class="tiny">'+esc(i.Categoria||'')+'</div></td><td>'+esc(i.Cantidad??'—')+'</td><td>'+esc(i.UnidadMedida||'—')+'</td><td class="'+(ad.NombreProveedor?'winner':'')+'">'+esc(ad.NombreProveedor||'No adjudicada')+'</td><td class="code">'+esc(ad.RutProveedor||'—')+'</td><td>'+esc(ad.MontoUnitario==null?'—':money(ad.MontoUnitario,detail.Moneda))+'</td></tr>'}).join('')+'</tbody></table></div></div>';
else if(activeTab==='campos'){const fs=m.fields||[];body.innerHTML='<div class="section"><h3>Inventario completo devuelto por la API</h3><div class="note">Esta vista no interpreta los datos: expone todos los campos presentes en la respuesta para no perder información útil durante el piloto.</div><div style="overflow:auto;margin-top:10px"><table class="fieldlist"><thead><tr><th>Ruta</th><th>Valor</th></tr></thead><tbody>'+fs.map(x=>'<tr><td>'+esc(x.path)+'</td><td>'+esc(typeof x.value==='object'?JSON.stringify(x.value):x.value)+'</td></tr>').join('')+'</tbody></table></div></div>'}
else body.innerHTML='<div class="section"><h3>Respuesta original</h3><pre class="raw">'+esc(JSON.stringify(rawDetail,null,2))+'</pre></div>'}
}
(async()=>{try{const raw=localStorage.getItem('mp_pilot_session');if(raw)session=JSON.parse(raw);if(session)await boot();else login()}catch{save(null);login()}})();
</script>
</body>
</html>
